    function searchJob(){
        var jobList = document.getElementById("jobList");
        jobList.innerHTML = "";
        searchJobList = []
        for(let i = 0; i < 3; i++){
            const newJob = document.createElement("div");
            const newJobTitle = document.createElement("h3");
            const newJobDescription = document.createElement("p");

            let aleaDomain = keys[ keys.length * Math.random() << 0]

            let aleaName = Math.floor(JOBDOMAIN[aleaDomain][5].length * Math.random() << 0);

            newJobTitle.textContent = JOBDOMAIN[aleaDomain][5][aleaName];

            let reward = (JOBDOMAIN[aleaDomain][0] * BASEJOBQUALITYMULT).toFixed(2)
            let experienceGain = (JOBDOMAIN[aleaDomain][1] * BASEJOBQUALITYMULT).toFixed(2)
            let risk = (JOBDOMAIN[aleaDomain][2] * BASEJOBDANGERMULT).toFixed(2)
            let pression = (JOBDOMAIN[aleaDomain][3] * BASEJOBDANGERMULT).toFixed(2)
            let difficulty = (JOBDOMAIN[aleaDomain][4] * BASEJOBDIFFICULTYMULT).toFixed(2)

            newJobDescription.textContent = "income: "+reward+"|experience: "+experienceGain+"|injury odds: "+risk+"|burnout odds: "+pression+"|failure odds: "+difficulty

            newJob.appendChild(newJobTitle);
            newJob.appendChild(newJobDescription);
            jobList.appendChild(newJob);
